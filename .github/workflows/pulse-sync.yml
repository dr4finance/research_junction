name: Sync Pulse Posts

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo (needed for keep-alive commit)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate posts and save to Firebase
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
        with:
          script: |
            const https = require('https');
            const FIREBASE_URL = 'insight-3bbec-default-rtdb.firebaseio.com';
            const FIREBASE_SEC = process.env.FIREBASE_SECRET;
            const GEMINI_KEY   = process.env.GEMINI_API_KEY;
            const GEMINI_MODEL = 'gemini-2.5-flash-lite';
            const MAX_POSTS    = 50;
            const SOURCES = [
              { name:'NEJM' }, { name:'The Lancet' }, { name:'JAMA' },
              { name:'BMJ' }, { name:'Nature Medicine' }, { name:'Science Daily' },
              { name:'Medscape' }, { name:'Stat News' }, { name:'Medical News Today' },
            ];
            function httpsRequest(options, body) {
              return new Promise((resolve, reject) => {
                const req = https.request(options, (res) => {
                  let data = '';
                  res.on('data', c => data += c);
                  res.on('end', () => resolve({ status: res.statusCode, body: data }));
                });
                req.on('error', reject);
                if (body) req.write(body);
                req.end();
              });
            }
            async function callGemini(prompt) {
              const systemText = 'You are writing for Research Junction by Sandra Bakare MD/MBA. ' +
                'Voice: authoritative, accessible, direct. Audience: medical researchers. ' +
                'You MUST respond with a single raw JSON object only. ' +
                'Do not include any text before or after the JSON. ' +
                'Do not use markdown code fences. ' +
                'The response must start with { and end with }.';
              const body = JSON.stringify({
                systemInstruction: { parts: [{ text: systemText }] },
                contents: [{ role: 'user', parts: [{ text: prompt }] }],
                tools: [{ googleSearch: {} }],
                generationConfig: {
                  maxOutputTokens: 2000,
                  temperature: 0.5,
                  thinkingConfig: { thinkingBudget: 0 },
                },
              });
              const options = {
                hostname: 'generativelanguage.googleapis.com',
                path: '/v1beta/models/' + GEMINI_MODEL + ':generateContent?key=' + GEMINI_KEY,
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(body) },
              };
              const { status, body: rb } = await httpsRequest(options, body);
              const data = JSON.parse(rb);
              if (status === 429) throw new Error('RATE_LIMITED');
              if (status !== 200) throw new Error('Gemini ' + status + ': ' + (data.error || {}).message);
              // Extract grounding citation URL from metadata
              let sourceUrl = null;
              let sourceUrlVerified = false;
              const candidate = (data.candidates || [])[0] || {};
              const groundingMeta = candidate.groundingMetadata || {};
              // Try groundingChunks first
              const chunks = groundingMeta.groundingChunks || [];
              for (const chunk of chunks) {
                const url = chunk.web && chunk.web.uri;
                if (url && url.startsWith('http')) { sourceUrl = url; sourceUrlVerified = true; break; }
              }
              // Fallback: parse chip hrefs from renderedContent
              if (!sourceUrlVerified) {
                const rendered = (groundingMeta.searchEntryPoint || {}).renderedContent || '';
                const chipMatch = rendered.match(/href="(https?:\/\/[^"]+)"/);
                if (chipMatch) { sourceUrl = chipMatch[1]; sourceUrlVerified = true; }
              }
              // Extract text parts
              const parts = (candidate.content && candidate.content.parts) || [];
              let text = parts.filter(p => p.text && !p.thought).map(p => p.text).join('');
              if (!text.trim()) text = parts.filter(p => p.text).map(p => p.text).join('');
              text = text.replace(/^```(?:json)?\s*/i, '').replace(/\s*```\s*$/i, '').trim();
              console.log('Raw response preview:', text.slice(0, 200));
              console.log('sourceUrlVerified:', sourceUrlVerified, '| sourceUrl:', sourceUrl);
              return { text, sourceUrl, sourceUrlVerified };
            }
            async function firebaseGet(path) {
              const { status, body } = await httpsRequest({
                hostname: FIREBASE_URL,
                path: '/' + path + '.json?auth=' + FIREBASE_SEC,
                method: 'GET'
              });
              if (status !== 200) throw new Error('Firebase GET ' + status);
              return JSON.parse(body);
            }
            async function firebasePut(path, data) {
              const body = JSON.stringify(data);
              const { status, body: resp } = await httpsRequest({
                hostname: FIREBASE_URL,
                path: '/' + path + '.json?auth=' + FIREBASE_SEC,
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(body) },
              }, body);
              if (status !== 200) throw new Error('Firebase PUT ' + status + ': ' + resp);
            }
            function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
            async function generatePost(source, usedUrls) {
              const avoid = usedUrls.slice(-10).join(', ') || 'none yet';
              const prompt =
                'Search for the most impactful recent medical research article published in the last 2 weeks from ' + source.name + '.\n' +
                'Avoid these URLs: ' + avoid + '\n\n' +
                'Respond with ONLY a JSON object in this exact format, no other text:\n' +
                '{\n' +
                '  "title": "headline under 12 words",\n' +
                '  "source": "' + source.name + '",\n' +
                '  "sourceUrl": "full article URL",\n' +
                '  "format": "full",\n' +
                '  "category": "one of: Clinical Research, Oncology, Cardiology, AI in Medicine, Infectious Disease, Mental Health, Surgery, Public Health, Neurology, Pharmacology",\n' +
                '  "summary": "2 sentence plain language summary",\n' +
                '  "content": "## What The Research Found\\n[findings]\\n## Why This Matters\\n[implications]\\n## Research Junction Take\\n[commentary]",\n' +
                '  "publishedAt": "' + new Date().toISOString() + '"\n' +
                '}';
              const { text: raw, sourceUrl: verifiedUrl, sourceUrlVerified } = await callGemini(prompt);
              const start = raw.indexOf('{');
              const end = raw.lastIndexOf('}');
              if (start === -1 || end === -1) {
                console.log('Full response was:', raw.slice(0, 500));
                throw new Error('No JSON in response');
              }
              const post = JSON.parse(raw.slice(start, end + 1));
              if (!post.title) throw new Error('Post missing title');
              // Use grounding-verified URL if available, otherwise fall back to model-reported URL
              post.sourceUrl = verifiedUrl || post.sourceUrl || null;
              post.sourceUrlVerified = sourceUrlVerified;
              // Discard post entirely if no verified source link
              if (!sourceUrlVerified) {
                console.log('Discarding post — no verified source URL for ' + source.name);
                return null;
              }
              post.id = 'post_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
              post.publishedAt = post.publishedAt || new Date().toISOString();
              return post;
            }
            // Main
            console.log('Starting Pulse sync...');
            let existingPosts = {};
            let usedUrls = [];
            try {
              const pd = await firebaseGet('pulse/posts');
              if (pd) existingPosts = pd;
              console.log('Loaded ' + Object.keys(existingPosts).length + ' existing posts');
            } catch(e) { console.warn('Could not load posts:', e.message); }
            try {
              const ud = await firebaseGet('pulse/usedUrls');
              if (Array.isArray(ud)) usedUrls = ud;
            } catch(e) {}
            const shuffled = [...SOURCES].sort(() => Math.random() - 0.5).slice(0, 3);
            const newPosts = {};
            for (let i = 0; i < shuffled.length; i++) {
              if (i > 0) { console.log('Waiting 15s...'); await sleep(15000); }
              const source = shuffled[i];
              console.log('Generating for ' + source.name + '...');
              try {
                const post = await generatePost(source, usedUrls);
                if (post) {
                  newPosts[post.id] = post;
                  usedUrls.push(post.sourceUrl);
                  console.log('Saved: ' + post.title);
                }
              } catch(e) {
                console.warn('Failed for ' + source.name + ':', e.message);
              }
            }
            if (Object.keys(newPosts).length === 0) { console.log('No verified posts this cycle'); return; }
            const allPosts = Object.assign({}, existingPosts, newPosts);
            const sorted = Object.values(allPosts)
              .sort((a, b) => new Date(b.publishedAt) - new Date(a.publishedAt))
              .slice(0, MAX_POSTS);
            const trimmed = {};
            sorted.forEach(p => { trimmed[p.id] = p; });
            await firebasePut('pulse/posts', trimmed);
            await firebasePut('pulse/usedUrls', usedUrls.slice(-500));
            await firebasePut('pulse/meta', { lastUpdate: Date.now() });
            console.log('Saved ' + Object.keys(newPosts).length + ' new posts. Total: ' + sorted.length);

      - name: Keep-alive commit (resets GitHub 60-day inactivity timer)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "pulse-sync: $(date -u '+%Y-%m-%d %H:%M UTC')" > .pulse-keepalive
          git add .pulse-keepalive
          git diff --staged --quiet || git commit -m "chore: pulse keepalive $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
